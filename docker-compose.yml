services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzas-personales-postgres
    environment:
      POSTGRES_DB: finanzas
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finanzas-personales-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finanzas.com
      PGADMIN_DEFAULT_PASSWORD: admin_finanzas
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
